services:
  - type: web
    name: mussa-vending-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false

  - type: web
    name: mussa-vending-web
    runtime: static
    rootDir: frontend
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
